# Publishes the English Privacy Policy (site/index.html) to GitHub Pages:
#   https://vladislavdrucok-tech.github.io/deepbounce/
# GitHub Pages serves the gh-pages branch (Settings → Pages → Deploy from a branch: gh-pages / root).
# This workflow copies only the public page into that branch; no other repository file is published.
name: Publish privacy policy

on:
  push:
    branches: [main]
    paths: ["site/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish unfinished placeholders
        run: |
          if grep -nE '\[(CONTACT EMAIL|DEVELOPER NAME|EFFECTIVE DATE)\]' site/index.html; then
            echo "::error::site/index.html still contains placeholders"; exit 1
          fi
      - name: Update the gh-pages branch with the public page only
        run: |
          set -e
          mkdir /tmp/public
          cp site/index.html /tmp/public/index.html
          cp site/index.html /tmp/public/privacy-policy.html
          touch /tmp/public/.nojekyll
          cd /tmp/public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish privacy policy from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
