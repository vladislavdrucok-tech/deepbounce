# Publishes the English Privacy Policy (folder site/) to GitHub Pages:
#   https://vladislavdrucok-tech.github.io/deepbounce/
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish privacy policy

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish unfinished placeholders
        run: |
          if grep -nE '\[(CONTACT EMAIL|DEVELOPER NAME|EFFECTIVE DATE)\]' site/index.html; then
            echo "::error::site/index.html still contains placeholders"; exit 1
          fi
      - name: Collect public files only
        run: |
          mkdir -p public
          cp site/index.html public/index.html
          cp site/index.html public/privacy-policy.html
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
